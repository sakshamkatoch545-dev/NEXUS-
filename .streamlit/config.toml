[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50
enableWebsocketCompression = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#080c14"
secondaryBackgroundColor = "#111827"
textColor = "#ffffff"
font = "monospace"
